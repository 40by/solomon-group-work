<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Цифровая групповая работа — Царь Соломон</title>
  <style>
    :root{--ink:#202020;--muted:#676767;--line:#c9c9c9;--paper:#fff;--soft:#f1f1f1;--gold:#c59d4b;--burg:#6c2638;--blue:#193b5a;--green:#2d5f55}
    *{box-sizing:border-box} body{margin:0;background:#e9e7e2;color:var(--ink);font:16px/1.4 Arial,sans-serif}
    button,input,textarea{font:inherit} button{cursor:pointer}
    .top{background:#202020;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10}
    .brand{font-weight:800;letter-spacing:.04em}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid #777;background:#fff;color:#202020;border-radius:9px;padding:9px 13px;font-weight:700}.btn.primary{background:var(--gold);border-color:var(--gold)}.btn.dark{background:#333;color:#fff}
    .status{font-size:13px;color:#ddd;min-width:92px}
    main{max-width:1440px;margin:0 auto;padding:28px}
    .hero{background:linear-gradient(120deg,#1e1e1e,#34302a);color:#fff;border-radius:22px;padding:48px;box-shadow:0 14px 40px #0002}
    .eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#e4c77e}
    h1{font-size:clamp(34px,5vw,64px);line-height:1;margin:12px 0 18px}.hero p{max-width:760px;color:#ddd;font-size:18px}
    .objective{border-left:4px solid var(--gold);padding-left:16px;margin-top:26px;max-width:900px}
    .rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}
    .room-card{border:0;text-align:left;color:#fff;border-radius:18px;padding:25px;min-height:190px;box-shadow:0 9px 24px #0002;transition:.2s transform}.room-card:hover{transform:translateY(-3px)}
    .room-card:nth-child(1){background:var(--blue)}.room-card:nth-child(2){background:var(--burg)}.room-card:nth-child(3){background:var(--green)}.room-card:nth-child(4){background:#5b4835}
    .room-card b{display:block;font-size:25px;margin:8px 0}.room-card span{opacity:.86}.room-card .open{margin-top:22px;font-weight:800;color:#f1d792}
    .workspace{display:none}.workspace.active{display:block}.sheet{background:var(--paper);border-radius:20px;box-shadow:0 12px 35px #0002;overflow:hidden}
    .sheet-head{background:#202020;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.sheet-head h2{font-size:32px;margin:4px 0}.sheet-head .meta{text-align:right;color:#ddd}.sheet-body{padding:24px}
    .goal{font-weight:800;margin-bottom:16px}.members{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;margin-bottom:18px}.members input{width:100%;padding:10px;border:0;border-bottom:2px solid var(--line)}
    .layout{display:grid;grid-template-columns:330px 1fr;gap:26px}.instructions{background:var(--soft);border:1px solid #bbb;border-radius:18px;padding:22px}.instructions h3{margin-top:0}.step{display:grid;grid-template-columns:32px 1fr;gap:10px;margin:12px 0}.num{width:30px;height:30px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-weight:800}
    .timer{margin-top:24px;background:#fff;border:1px solid #bbb;border-radius:14px;padding:16px}.clock{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}.timer-actions{display:flex;gap:7px;flex-wrap:wrap}
    textarea{width:100%;resize:vertical;border:1px solid #aaa;border-radius:9px;padding:10px;background:#fff;min-height:58px}
    .pyramid{display:grid;justify-items:center;gap:10px;padding:8px}.tier{border:2px solid #262626;background:#f3f3f3;padding:16px}.tier h3{margin:0 0 5px;text-align:center}.tier small{display:block;text-align:center;color:var(--muted);margin-bottom:10px}.tier.one{width:48%;clip-path:polygon(50% 0,100% 100%,0 100%);padding:70px 14% 18px}.tier.two{width:75%}.tier.three{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .reason{border:2px solid #262626;border-radius:15px;padding:16px;margin-top:10px}.reason h3{margin:0 0 8px}
    .mountain{position:relative;min-height:625px;padding:10px 8px 0}.mountain-shape{position:absolute;left:8%;right:8%;top:72px;bottom:95px;background:#ededed;clip-path:polygon(50% 0,100% 100%,0 100%);border-bottom:3px solid #222}.mountain-shape:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 49.2%,#222 49.5%,#222 50.2%,transparent 50.5%);opacity:.55}
    .node{position:absolute;background:#fff;border:2px solid #222;border-radius:15px;padding:12px;z-index:2;box-shadow:0 5px 15px #0001}.node h3{font-size:15px;margin:0 0 7px}.node small{color:var(--muted)}.node textarea{margin-top:7px;min-height:72px}.n1{left:2%;bottom:70px;width:29%}.n2{left:18%;top:275px;width:31%}.n3{left:34%;top:5px;width:32%}.n4{right:18%;top:275px;width:31%}.n5{right:2%;bottom:70px;width:29%}
    .legend{position:absolute;bottom:0;left:2%;right:2%;border:2px solid #222;border-radius:14px;padding:12px;background:#fff;z-index:2}.legend textarea{min-height:50px}
    .footer-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.hintbox{display:none;background:#fff6dd;border-left:5px solid var(--gold);padding:13px;margin-top:14px}.hintbox.show{display:block}
    .present .instructions,.present .members,.present .goal,.present .footer-actions .secondary,.present .hintbox{display:none}.present .layout{grid-template-columns:1fr}.present .sheet-body{padding:30px}.present textarea{border-color:#777}
    @media(max-width:900px){main{padding:12px}.hero{padding:28px}.rooms,.layout{grid-template-columns:1fr}.sheet-head{display:block}.sheet-head .meta{text-align:left}.instructions{order:2}.grid3{grid-template-columns:1fr}.tier.one{width:75%;clip-path:none;padding:16px}.tier.two,.tier.three{width:100%}.mountain{min-height:920px}.mountain-shape{display:none}.node{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:100%!important;margin:10px 0}.legend{position:relative;left:auto;right:auto;bottom:auto}}
    @media print{.top,.instructions,.footer-actions,.timer,.hintbox{display:none!important}body{background:#fff}.workspace{display:block}.home{display:none}.sheet{box-shadow:none;border-radius:0}.layout{display:block}.sheet-body{padding:12px}.sheet-head{print-color-adjust:exact;-webkit-print-color-adjust:exact}.mountain{min-height:610px}textarea{border:0;overflow:visible}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">ЦИФРОВОЙ АРХИВ СОЛОМОНА</div>
    <div class="top-actions"><span class="status" id="saveStatus">Готово</span><button class="btn dark" id="homeBtn" hidden>Все группы</button></div>
  </header>
  <main>
    <section class="home" id="home">
      <div class="hero">
        <div class="eyebrow">Русская литература · 6 класс</div>
        <h1>Цифровая групповая работа</h1>
        <p>Выберите свою группу. Каждая команда работает в отдельной цифровой комнате. Ответы сохраняются автоматически на этом устройстве.</p>
        <div class="objective"><b>Цель:</b> определить главную и второстепенную информацию текста.</div>
      </div>
      <div class="rooms" id="rooms"></div>
    </section>
    <section class="workspace" id="workspace"></section>
  </main>
  <script>
    const groups=[
      {id:1,text:'«Соломон»',type:'pyramid',title:'Информационная пирамида',color:'blue'},
      {id:2,text:'«Соломон»',type:'mountain',title:'Органайзер «Гора историй»',color:'burg'},
      {id:3,text:'«Суд Соломона»',type:'pyramid',title:'Информационная пирамида',color:'green'},
      {id:4,text:'«Суд Соломона»',type:'mountain',title:'Органайзер «Гора историй»',color:'brown'}
    ];
    const rooms=document.getElementById('rooms'), home=document.getElementById('home'), workspace=document.getElementById('workspace'), homeBtn=document.getElementById('homeBtn'), saveStatus=document.getElementById('saveStatus');
    rooms.innerHTML=groups.map(g=>`<button class="room-card" data-id="${g.id}"><span>Группа ${g.id} · Текст ${g.text}</span><b>${g.title}</b><span>${g.type==='pyramid'?'1 главная информация · 2 второстепенных факта · 3 детали':'Начало · развитие · главное событие · последствия · итог'}</span><div class="open">Открыть комнату →</div></button>`).join('');
    rooms.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openGroup(+b.dataset.id)});
    homeBtn.onclick=()=>{history.pushState({},'',location.pathname);showHome()}; window.onpopstate=route;
    function route(){const n=+(new URLSearchParams(location.search).get('group'));n>=1&&n<=4?openGroup(n,false):showHome()}
    function showHome(){workspace.classList.remove('active');home.style.display='block';homeBtn.hidden=true;document.body.classList.remove('present');window.scrollTo(0,0)}
    function field(name,placeholder=''){return `<textarea data-field="${name}" placeholder="${placeholder}"></textarea>`}
    function instructions(type){return `<aside class="instructions"><h3>КАК РАБОТАТЬ</h3>${(type==='pyramid'?["Каждый участник самостоятельно находит главную мысль и одну деталь.","Обсудите все варианты и выберите наиболее точные.","Заполните пирамиду сверху вниз. Пишите кратко.","Распределите выступление так, чтобы прозвучал общий вывод."]:["Каждый участник выделяет одно важное событие текста.","Восстановите развитие событий от начала до последствий.","На вершине укажите главное событие, в остальных блоках — второстепенную информацию.","Сформулируйте итог и распределите части выступления."]).map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div>${x}</div></div>`).join('')}<div class="timer"><b>Время работы</b><div class="clock" id="clock">07:00</div><div class="timer-actions"><button class="btn primary" id="timerStart">Старт</button><button class="btn" id="timerPause">Пауза</button><button class="btn" id="timerReset">Сброс</button></div></div></aside>`}
    function organizer(g){if(g.type==='pyramid')return `<div><div class="pyramid"><section class="tier one"><h3>1 ГЛАВНАЯ ИНФОРМАЦИЯ</h3><small>Одно предложение</small>${field('main','Сформулируйте главное...')}</section><section class="tier two"><h3>2 ВАЖНЫХ ВТОРОСТЕПЕННЫХ ФАКТА</h3><small>Без них трудно понять главное</small><div class="grid2">${field('fact1','Факт 1')}${field('fact2','Факт 2')}</div></section><section class="tier three"><h3>3 УТОЧНЯЮЩИЕ ДЕТАЛИ</h3><small>Конкретные сведения</small><div class="grid3">${field('detail1','Деталь 1')}${field('detail2','Деталь 2')}${field('detail3','Деталь 3')}</div></section></div><section class="reason"><h3>Почему информация на вершине является главной?</h3>${field('reason','Объясните выбор группы...')}</section></div>`;
      return `<div class="mountain"><div class="mountain-shape"></div><section class="node n1"><h3>1. ПОДНОЖИЕ · НАЧАЛО</h3><small>Герои и исходная ситуация</small>${field('start')}</section><section class="node n2"><h3>2. ПОДЪЁМ · РАЗВИТИЕ</h3><small>Два важных события</small>${field('rise')}</section><section class="node n3"><h3>3. ВЕРШИНА · ГЛАВНОЕ</h3><small>Ключевое событие текста</small>${field('peak')}</section><section class="node n4"><h3>4. СПУСК · ПОСЛЕДСТВИЯ</h3><small>Что произошло после</small>${field('fall')}</section><section class="node n5"><h3>5. ИТОГ ПУТИ</h3><small>Главная информация текста</small>${field('result')}</section><section class="legend"><b>Почему событие на вершине главное?</b>${field('reason')}</section></div>`}
    function openGroup(id,push=true){const g=groups.find(x=>x.id===id);if(push)history.pushState({},'',`${location.pathname}?group=${id}`);home.style.display='none';homeBtn.hidden=false;workspace.classList.add('active');workspace.innerHTML=`<article class="sheet"><header class="sheet-head"><div><div class="eyebrow">Группа ${g.id}</div><h2>${g.title}</h2></div><div class="meta"><b>Текст: ${g.text}</b><br>Русская литература · 6 класс</div></header><div class="sheet-body"><div class="goal">Цель: определить главную и второстепенную информацию текста.</div><label class="members"><b>Участники группы:</b><input data-field="members" placeholder="Введите имена участников"></label><div class="layout">${instructions(g.type)}<section>${organizer(g)}<div class="hintbox" id="hintbox">${g.type==='pyramid'?'Если убрать выбранную информацию, изменится ли понимание основного содержания текста?':'Какое событие нельзя убрать, не нарушив логику всей истории?'}</div><div class="footer-actions"><div><button class="btn secondary" id="hintBtn">Цифровая подсказка</button> <button class="btn secondary" id="clearBtn">Очистить</button></div><div><button class="btn" id="printBtn">Печать / PDF</button> <button class="btn primary" id="presentBtn">Режим защиты</button></div></div></section></div></div></article>`;bind(g);load(g.id);window.scrollTo(0,0)}
    function key(id){return `solomon-group-${id}`}
    function save(id){const data={};workspace.querySelectorAll('[data-field]').forEach(x=>data[x.dataset.field]=x.value);localStorage.setItem(key(id),JSON.stringify(data));saveStatus.textContent='Сохранено ✓';setTimeout(()=>saveStatus.textContent='Автосохранение',1100)}
    function load(id){try{const data=JSON.parse(localStorage.getItem(key(id))||'{}');workspace.querySelectorAll('[data-field]').forEach(x=>x.value=data[x.dataset.field]||'')}catch(e){}}
    function bind(g){let debounce;workspace.addEventListener('input',()=>{saveStatus.textContent='Сохраняю…';clearTimeout(debounce);debounce=setTimeout(()=>save(g.id),350)});document.getElementById('hintBtn').onclick=()=>document.getElementById('hintbox').classList.toggle('show');document.getElementById('clearBtn').onclick=()=>{if(confirm('Очистить ответы этой группы?')){localStorage.removeItem(key(g.id));load(g.id)}};document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('presentBtn').onclick=()=>{document.body.classList.toggle('present');document.getElementById('presentBtn').textContent=document.body.classList.contains('present')?'Вернуться к работе':'Режим защиты'};let left=420,t=null;const clock=document.getElementById('clock');const draw=()=>clock.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;document.getElementById('timerStart').onclick=()=>{if(t)return;t=setInterval(()=>{if(left>0){left--;draw()}else{clearInterval(t);t=null;alert('Время групповой работы завершено!')}},1000)};document.getElementById('timerPause').onclick=()=>{clearInterval(t);t=null};document.getElementById('timerReset').onclick=()=>{clearInterval(t);t=null;left=420;draw()}}
    route();
  </script>
</body>
</html>
